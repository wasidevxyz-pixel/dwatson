<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="420" height="90">
  <defs>
    <linearGradient id="dwRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="dwBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="dwShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>
  
  <!-- Emblem / Shield -->
  <g transform="translate(10, 10)" filter="url(#dwShadow)">
    <rect x="0" y="0" width="70" height="70" rx="16" fill="url(#dwBlueGrad)" />
    <!-- Red Accent Corner Strip -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 35 0 L 0 35 Z" fill="url(#dwRedGrad)" />
    
    <!-- Medical / Quality Cross & DW monogram in emblem -->
    <!-- Medical Cross -->
    <path d="M 30 18 L 40 18 L 40 28 L 50 28 L 50 38 L 40 38 L 40 48 L 30 48 L 30 38 L 20 38 L 20 28 L 30 28 Z" fill="#FFFFFF" opacity="0.95" />
    <path d="M 32 20 L 38 20 L 38 30 L 48 30 L 48 36 L 38 36 L 38 46 L 32 46 L 32 36 L 22 36 L 22 30 L 32 30 Z" fill="url(#dwRedGrad)" />
    
    <!-- Star of Life / Trust Dots -->
    <circle cx="35" cy="56" r="3" fill="#60A5FA" />
    <circle cx="23" cy="56" r="2" fill="#F87171" />
    <circle cx="47" cy="56" r="2" fill="#F87171" />
  </g>
  
  <!-- Text Brand Name -->
  <g transform="translate(95, 12)">
    <!-- Brand Title -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="36" letter-spacing="-0.5">
      <tspan fill="#DC2626">D.</tspan>
      <tspan fill="#0F172A"> WATSON</tspan>
    </text>
    
    <!-- Subtitle / Categories -->
    <text x="2" y="58" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="11.5" fill="#2563EB" letter-spacing="2.5">
      CHEMIST &amp; SUPERSTORE
    </text>
    
    <!-- Small Tagline -->
    <text x="2" y="70" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="9" fill="#64748B" letter-spacing="0.8">
      PHARMACY • COSMETICS • GROCERY • OPTICS • SURGICAL
    </text>
  </g>
</svg>
